<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock</title>
</head>

<body>
    <div class="container">
        <h1>
            World Clock
        </h1>
        <select name="" id="city">
            <option value="">Select a city...</option>
            <option value="current">My current location</option>
            <option value="America/New_York">New York</option>
            <option value="Europe/London">London</option>
            <option value="Australia/Sydney">Sydney</option>
            <option value="Africa/Nairobi">Nairobi</option>
            <option value="Europe/Moscow">Moscow</option>
        </select>
        <div id="cities">
            <div class="city" id="iran">
                <div class="left">
                    <h2>Tehran 🇮🇷</h2>
                    <div class="date"></div>
                </div>
                <div class="right">
                    <div class="time"></div>
                </div>
            </div>
            <div class="city" id="islamabad">
                <div class="left">
                    <h2>Islamabad 🇵🇰
                    </h2>
                    <div class="date"></div>
                </div>
                <div class="right">
                    <div class="time"></div>
                </div>
            </div>
            <div class="city" id="china">
                <div class="left">
                    <h2>Hong Kong :🇨🇳 </h2>
                    <div class="date"></div>
                </div>
                <div class="right">
                    <div class="time"></div>
                </div>
            </div>
        </div>
        <footer>
            This project was coded by <a href="https://github.com/farzanatavakkoli" target="_blank">Farzana
                Tavakkoli</a> is
            open sourced <a href="https://github.com/farzanatavakkoli/World-Clock" target="_blank">on github</a>
            and
            hosted <a href="https://world-clock-rouge.vercel.app/" target="_blank">on vercel.</a>
        </footer>
    </div>
    <script src="Javascript/index.js"></script>
</body>

</html>
